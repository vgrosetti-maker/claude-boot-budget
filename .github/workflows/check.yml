name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        # No glob argument: Node's test runner auto-discovers *.test.js recursively.
        # A shell glob here would need different quoting on pwsh (windows-latest) vs bash.
        run: node --test

      - name: Run auditor against its own profiles (pre-publish gate)
        run: node bin/claude-boot-budget.js profiles
